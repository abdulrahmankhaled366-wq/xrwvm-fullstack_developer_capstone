<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <title>Contact Us - Best Cars</title>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
        <div class="container-fluid">
            <h2 style="padding-right: 5%;">Dealerships</h2>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" style="font-size: larger;" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" style="font-size: larger;" href="/contact">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Content -->
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header text-white" style="background-color: #20b2aa;">
                <h2 class="text-center">Contact Our Team</h2>
            </div>
            <div class="card-body">
                <div class="row text-center">
                    <div class="col-md-4">
                        <img src="/static/contact-icon.png" alt="Address" style="width: 50px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1216/1216844.png'">
                        <h4>Our Location</h4>
                        <p>123 Automotive Way, Detroit, MI, 48201</p>
                    </div>
                    <div class="col-md-4">
                        <img src="/static/phone-icon.png" alt="Phone" style="width: 50px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/597/597177.png'">
                        <h4>Phone Number</h4>
                        <p>+1 (800) BEST-CAR<br>+1 (313) 555-0199</p>
                    </div>
                    <div class="col-md-4">
                        <img src="/static/email-icon.png" alt="Email" style="width: 50px;" onerror="this.src='https://cdn-icons-png.flaticon.com/512/542/542689.png'">
                        <h4>Email Support</h4>
                        <p>support@bestcars.com<br>sales@bestcars.com</p>
                    </div>
                </div>
            </div>
            <div class="card-footer text-muted text-center">
                We are available 24/7 to assist with your dealership inquiries.
            </div>
        </div>
    </div>
</body>
</html>
